[project]
name = "agrim-autojudge"
version = "1.1.0"
description = "Agentic hackathon Shortlist Generator with full audit traces, prompt caching, tool-calling inference, repo snapshot cache, and judge-review item routing."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Agrim AI" }]
license = { text = "Proprietary" }
dependencies = [
    "anthropic>=0.40.0",
    "openai>=1.50.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
    "streamlit>=1.38.0",
    "pandas>=2.2.0",
    "playwright>=1.46.0",
    "pypdf>=4.3.0",
    "youtube-transcript-api>=0.6.2",
    "rich>=13.7.0",
    "typer>=0.12.0",
    "PyGithub>=2.3.0",
    "tenacity>=9.0.0",
    "psycopg[binary,pool]>=3.2.0",
]

[project.scripts]
autojudge = "autojudge.cli:app"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"autojudge" = ["../../prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
