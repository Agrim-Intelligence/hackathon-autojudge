# Agrim AutoJudge — Railway service reference (v1.2).
#
# Two services + one Postgres. Per-service configs are NOT merged into a
# single railway.toml — Railway picks one TOML per service, so each service
# gets its own file:
#
#   - railway.dashboard.toml   judges' review UI (Streamlit) + on-demand
#                              evaluation. Attach a 10 GB volume at /data.
#   - railway.intake.toml      public candidate submission form (Streamlit).
#                              No volume required.
#
# Both services share env vars and the same Docker image; only the start
# command and the volume attachment differ. ``DATABASE_URL`` is shared via
# a Railway Reference Variable to the Postgres plugin so both services see
# the same backing store.
#
# The continuous worker service from v1.1 has been removed. Evaluation is
# triggered on demand by the dashboard's "Evaluate selected" button, which
# spawns one background ``autojudge run <id>`` subprocess per selected
# submission. The subprocesses run inside the dashboard service.
#
# For the click-by-click setup (Railway dashboard) and the one-shot CLI
# deployment, see ``NEXT_STEPS.md`` and ``scripts/deploy_railway.sh``.
