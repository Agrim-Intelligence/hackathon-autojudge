# Agrim AutoJudge — shared Railway config (v1.2).
#
# ONE config for BOTH services. The dashboard and intake services use the same
# Docker image and the same healthcheck; they differ ONLY by the
# AUTOJUDGE_ROLE environment variable (dashboard | intake), which scripts/
# start.sh reads to launch the right Streamlit app.
#
# Topology:
#   - dashboard service : AUTOJUDGE_ROLE=dashboard, 10 GB volume at /data,
#                         judges' UI + on-demand "Evaluate" buttons.
#   - intake service    : AUTOJUDGE_ROLE=intake, no volume, public form.
#   - Postgres          : shared backing store; both services get
#                         DATABASE_URL=${{Postgres.DATABASE_URL}}.
#
# The continuous worker service from v1.1 is gone — evaluation is triggered on
# demand from the dashboard, which spawns `autojudge run <id>` subprocesses.
#
# One-shot deploy / cleanup: scripts/deploy_railway.sh. Operator runbook:
# NEXT_STEPS.md.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# No startCommand here on purpose — the Docker CMD (scripts/start.sh) handles
# it and dispatches on AUTOJUDGE_ROLE. Healthcheck is identical for both
# Streamlit services.
healthcheckPath = "/_stcore/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
