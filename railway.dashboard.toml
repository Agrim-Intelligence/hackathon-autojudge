# Railway service config — dashboard (judges' review UI).
#
# Apply via the Railway CLI (see scripts/deploy_railway.sh) or paste under
# Settings → Service → Config in the Railway dashboard.
#
# Required env vars (set on this service in Railway):
#   DATABASE_URL                         (shared with intake — Reference Variable)
#   ANTHROPIC_API_KEY / GROQ_API_KEY     (provider keys; shared)
#   GITHUB_TOKEN                         (PyGithub auth; shared)
#   AUTOJUDGE_PRIMARY_PROVIDER           (e.g. anthropic)
#   AUTOJUDGE_FALLBACK_PROVIDER          (e.g. groq)
#   AUTOJUDGE_DASHBOARD_BASIC_AUTH_USER  (judges' username)
#   AUTOJUDGE_DASHBOARD_BASIC_AUTH_PASS  (judges' password)
#   AUTOJUDGE_HACKATHON_START / _END
#   AUTOJUDGE_DATA_DIR=/data             (volume mount point)
#
# Attach a 10 GB Railway volume to this service at /data — used for repo
# snapshot tarballs and Playwright screenshots during background evaluation.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "bash -lc 'streamlit run dashboard/app.py --server.port=$PORT --server.address=0.0.0.0 --server.headless=true'"
healthcheckPath = "/_stcore/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
