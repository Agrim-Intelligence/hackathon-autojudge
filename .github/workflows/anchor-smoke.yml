name: anchor-smoke

# Runs the three calibration anchors on PRs that touch agents, prompts, or
# rubric config. The job fails when any anchor's total deviates from its
# expected score by more than rubric/anchors.MAX_DRIFT.
#
# The nightly cron schedule is disabled for now to stop spending Action
# minutes on it — re-enable by uncommenting the `schedule:` block below when
# needed again. workflow_dispatch below still allows an on-demand manual run.
#
# The job needs at least one LLM provider key. Defaults match the secrets
# configured on the repo (Anthropic primary, Groq fallback). Override via
# org/repo Variables AUTOJUDGE_PRIMARY_PROVIDER / AUTOJUDGE_FALLBACK_PROVIDER.

on:
  pull_request:
    paths:
      - "src/autojudge/agents/**"
      - "src/autojudge/rubric/**"
      - "src/autojudge/orchestrator.py"
      - "prompts/**"
      - "anchors/**"
      - ".github/workflows/anchor-smoke.yml"
  # schedule:
  #   - cron: "0 19 * * *"   # 00:30 IST nightly — disabled to save Action minutes
  workflow_dispatch: {}

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AUTOJUDGE_PRIMARY_PROVIDER: ${{ vars.AUTOJUDGE_PRIMARY_PROVIDER || 'anthropic' }}
      # Must be a valid provider literal or omitted — never ''. An empty org
      # var would otherwise override Settings and fail pydantic validation.
      AUTOJUDGE_FALLBACK_PROVIDER: ${{ vars.AUTOJUDGE_FALLBACK_PROVIDER || 'groq' }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GITHUB_TOKEN: ${{ secrets.AGRIM_GITHUB_PAT }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install autojudge + Playwright
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          playwright install --with-deps chromium

      - name: Resolved provider routing
        run: autojudge doctor || true

      - name: Run anchors
        run: autojudge run-anchors

      - name: Leaderboard (anchors included)
        if: always()
        run: autojudge leaderboard --anchors
